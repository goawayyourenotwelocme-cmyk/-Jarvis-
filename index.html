<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020817">
  <meta name="description" content="J.A.R.V.I.S. Personal AI Assistant">
  <title>J.A.R.V.I.S.</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">

    <header>
      <h1>J.A.R.V.I.S.</h1>
      <p id="status">CONNECTING...</p>
    </header>

    <section class="core">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="center"></div>
    </section>

    <section id="chat" class="conversation" aria-live="polite">
      <div class="message assistant">
        J.A.R.V.I.S. systems initialized. Awaiting your command.
      </div>
    </section>

    <form id="textForm" class="composer">
      <input
        id="textInput"
        type="text"
        placeholder="Message J.A.R.V.I.S..."
        autocomplete="off"
      >
      <button id="sendButton" type="submit">SEND</button>
    </form>

    <button id="activate" type="button">ACTIVATE J.A.R.V.I.S.</button>
    <button id="stop" type="button">STANDBY</button>

  </main>

  <script src="./script.js"></script>
</body>
</html>
